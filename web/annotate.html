<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtLens · 画面标注</title><link rel="stylesheet" href="/annotate.css"><script src="/media-binding.js" defer></script><script src="/annotation-model.js" defer></script><script src="/annotate.js" defer></script></head><body>
<header><a href="/projects.html">CourtLens <small>观赛透镜</small></a><span>把判断，落回画面。</span><a id="back-link" href="/projects.html">返回项目</a></header><main><div class="intro"><div><p class="eyebrow">FRAME BY FRAME / HUMAN REVIEW</p><h1>画面标注</h1><p id="project-name">正在读取项目…</p></div><div><button id="download-draft" disabled>下载标注草稿</button> <button id="save" disabled>保存标注</button></div></div><p id="status" role="status">视频保留在本机，人工标注有独立来源标签。</p>
<div class="layout"><section><div id="stage"><video id="film" preload="metadata" controls aria-label="标注源视频"></video><svg id="canvas" aria-label="标注画布，选择工具后点击画面" role="img"></svg></div><p id="binding" role="status">正在核对视频</p><div class="toolbar"><button id="toggle-play">播放 / 暂停</button><button id="back-frame">− 0.1 秒</button><span id="clock">0.00 秒</span><button id="forward-frame">+ 0.1 秒</button><button id="cancel-draw">取消当前绘制</button></div><p class="hint">暂停视频后，用“箭头”点击起点和终点，用“区域”点击矩形两角。已有标注按所设时间出现；图形是人工静态标记，不代表自动跟踪。</p></section>
<aside><label>标注哪个回合<select id="possession"></select></label><div class="two"><label>工具<select id="kind"><option value="arrow">箭头 · 两点</option><option value="zone">区域 · 两角</option><option value="label">文字 · 一点</option></select></label><label>标签<input id="label" maxlength="100" value="观察位置"></label></div><div class="two"><label>开始（秒）<input id="start" type="number" step="0.05" min="0"></label><label>结束（秒）<input id="end" type="number" step="0.05" min="0"></label></div><button id="use-time">以当前时刻为起点</button><label class="check"><input id="reviewed" type="checkbox">我已核对这段时间与画面，标注期间没有镜头切换。</label><p class="hint">人工标注单独记录画面复核，不改变自动轨迹的校准状态。相机运动时请缩短区间或拆成多个标注；系统不会推断运动轨迹。</p><h2>当前回合标注</h2><div id="annotations"></div><p class="hint">保存会创建新历史版本，并撤销项目整体复核。回到项目页核对后再导出。</p></aside></div></main></body></html>
