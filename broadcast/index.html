<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070B14">
  <title>CourtLens Broadcast · 一次进攻，讲清一个选择</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <div id="root" class="app-shell">
    <header class="topbar">
      <a class="brand" href="/broadcast/" aria-label="CourtLens Broadcast 首页"><img class="brand-mark" src="/favicon.svg" alt=""><span><strong>COURTLENS</strong><small>BROADCAST</small></span></a>
      <span class="topbar-rule" aria-hidden="true"></span>
      <span class="topbar-context" id="topbar-context">一次进攻，讲清一个选择</span>
      <div class="topbar-actions"><button type="button" class="text-button" id="project-picker-button" data-action="projects">我的项目</button></div>
    </header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="workspace" tabindex="-1"><div class="loading-screen"><span class="loader" aria-hidden="true"></span><p>正在连接制作台…</p></div></main>
    <footer class="app-footer"><span>COURTLENS · BROADCAST</span><span>画面、数字与判断，都有出处。</span></footer>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
