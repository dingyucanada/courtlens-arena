name: Publish Broadcast public rehearsal (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Broadcast public evidence and browser logic
        run: |
          python tools/test_site.py
          npm test
      - name: Require successful Product checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_product_checks.py
      - name: Build static site
        run: python tools/build_site.py --mode pages --output site-dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
